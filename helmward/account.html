<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account · Overhand</title>
<style>
  :root { --bg:#0b0c10; --card:#15171e; --line:#262a36; --fg:#f2f4f8; --mut:#9aa3b2; --accent:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --card:#fff; --line:#e6e8ef; --fg:#11141a; --mut:#5b6472; --accent:#2f6bff; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:40px 20px 60px; }
  h1 { font-size:26px; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .mut { color:var(--mut); } .sm { font-size:13px; } b { font-weight:650; }
  input { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:16px; width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  .btn { display:block; text-align:center; text-decoration:none; cursor:pointer; border:none;
    background:var(--accent); color:#fff; border-radius:10px; padding:13px 16px; font-size:16px; font-weight:650; width:100%; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .pill { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:color-mix(in srgb,var(--mut) 22%,transparent); color:var(--mut); }
  .pill.pro { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); }
  .err { color:var(--err); font-size:14px; } .ok { color:var(--ok); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Your Overhand account</h1>
  <div id="app"></div>
</main>
<script>
  const API = "https://helmward-signaling.mwsupplylimited.workers.dev";
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem("oh_token") || "";
  let acct  = sessionStorage.getItem("oh_acct")  || "";
  let email = sessionStorage.getItem("oh_email") || "";

  async function api(method, path, body, authed) {
    const headers = {};
    if (body) headers["Content-Type"] = "application/json";
    if (authed && token) headers["Authorization"] = "Bearer " + token;
    const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = JSON.parse(await r.text()); } catch {}
    if (!r.ok) { const e = new Error(data.error || ("Request failed (" + r.status + ")")); e.status = r.status; throw e; }
    return data;
  }
  const gb = (b) => (Number(b) / 1e9).toFixed(3);   // 3 decimals so small usage (0.003 GB) is visible
  const wholeGB = (b) => Math.round(Number(b) / 1e9);   // round numbers for prose ("50 GB this month")

  // The plan allowance refills at 00:00 UTC on the 1st of next month, matching the Worker's `YYYY-MM`
  // UTC month bucket (`monthKey`). Rendered in the visitor's own time zone, so someone west of UTC
  // correctly sees the local date that instant actually falls on.
  const planResetLabel = () => {
    const n = new Date();
    return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth() + 1, 1))
      .toLocaleDateString(undefined, { day: "numeric", month: "short" });
  };

  function render() { token ? renderAccount() : renderLogin(); }

  function renderLogin() {
    $("app").innerHTML = `
      <div class="card col">
        <p class="mut sm">Sign in with your Overhand account — the email + password you use in the app. This is <b>not</b> your Apple ID.</p>
        <input id="email" type="email" placeholder="Email" autocomplete="username">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
        <div id="err" class="err"></div>
        <button id="signin" class="btn">Sign In</button>
      </div>`;
    $("signin").onclick = doLogin;
    $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  }
  async function doLogin() {
    $("err").textContent = "Signing in…";
    try {
      const r = await api("POST", "/v1/auth/login", { email: $("email").value.trim(), password: $("pw").value }, false);
      token = r.token; acct = r.accountId; email = $("email").value.trim().toLowerCase();
      sessionStorage.setItem("oh_token", token); sessionStorage.setItem("oh_acct", acct); sessionStorage.setItem("oh_email", email);
      render();
    } catch (e) { $("err").textContent = e.message; }
  }

  async function renderAccount() {
    $("app").innerHTML = `<div class="card"><p class="mut">Loading…</p></div>`;
    let s = null;
    try { s = await api("GET", "/v1/relay/status", null, true); }
    catch (e) { if (e.status === 401) return signOut(); $("app").innerHTML = `<div class="card"><p class="err">${e.message}</p></div>`; return; }
    const isPro = !!(s && s.isPro);
    // The account's TWO pots, kept apart. The Worker always spends the monthly plan allowance first and
    // debits the bought/earned balance only with the overflow (`reportRelayUsage`:
    // fromBalance = max(0, bytes - allowanceRemaining)), and buckets usage per UTC month so the allowance
    // refills on its own. This page used to merge both into one "used / limit" figure, which hid that
    // order AND filed the never-expiring balance under "this month".
    const planLimit = Number(s.monthlyLimitBytes) || 0;
    const rawUsed   = Number(s.monthlyUsedBytes) || 0;
    // Clamp: raw usage keeps climbing past the allowance once extra data is being spent, so it must
    // never be shown against the allowance unclamped (else "60.000 / 50.000 GB").
    const planUsed  = Math.min(rawUsed, planLimit);
    const planLeft  = Math.max(0, planLimit - rawUsed);
    const extra     = Number(s.dataBalanceBytes) || 0;
    const onExtra   = planLeft <= 0;               // which pot a session draws on right now
    const reset     = planResetLabel();
    // "Used first", NOT "In use now": this card also promises nothing is metered while no one is
    // connected, so a present-tense badge would read as "your data is draining right now" and
    // contradict it. "Used first" states the ORDER, which is what's actually being claimed.
    const badge     = `<span class="pill pro">Used first</span>`;
    const order = onExtra && extra <= 0
      ? `You've used all your internet data. Your plan data refills on ${reset}, or add extra data to reconnect now. Same-network (Wi-Fi/LAN) connections still work, free.`
      : onExtra
        ? `This month's plan data is used up, so sessions are using your extra data now. When your plan data refills on ${reset}, Overhand goes straight back to it and leaves the rest of your extra data alone until it's needed again.`
        : extra > 0
          ? `Overhand always uses your plan data first, so your ${gb(extra)} GB of extra data is untouched until this month's plan data runs out. It refills on ${reset} — your extra data just waits, and never expires.`
          : `Overhand always uses your plan data first. Extra data you buy is only spent once the month's plan data runs out — it never expires.`;
    $("app").innerHTML = `
      <div class="card col">
        <div class="row"><b>${email}</b><span class="pill ${isPro ? 'pro' : ''}">${isPro ? 'Overhand Pro' : 'Free'}</span></div>
        <div class="row"><span class="mut">Plan data ${onExtra ? '' : badge}</span><b>${gb(planUsed)} / ${gb(planLimit)} GB</b></div>
        <p class="mut sm">Included with your plan — ${wholeGB(planLimit)} GB this month. Refills ${reset}.</p>
        <div class="row"><span class="mut">Extra data ${onExtra && extra > 0 ? badge : ''}</span><b>${gb(extra)} GB</b></div>
        <p class="mut sm">Data packs and converted tokens. ${extra > 0 ? 'Never expires.' : 'Nothing here yet.'}</p>
        <p class="mut sm">${order}</p>
        <p class="mut sm">Everything over the internet counts — direct or relay, at the same rate. Same-network (Wi-Fi/LAN) connections are free, and nothing counts while no one is connected.</p>
        <a class="btn" href="buy.html?acct=${encodeURIComponent(acct)}&email=${encodeURIComponent(email)}">Buy extra data or go Pro</a>
        ${isPro ? `<button id="portal" class="btn ghost">Manage subscription</button><div id="porterr" class="mut sm"></div>` : ``}
      </div>
      <div class="card col">
        <b>Change email</b>
        <input id="nem" type="email" placeholder="New email" autocomplete="email">
        <input id="ecur" type="password" placeholder="Current password" autocomplete="current-password">
        <div id="eerr" class="err"></div><div id="eok" class="ok"></div>
        <button id="chgem" class="btn ghost">Change email</button>
      </div>
      <div class="card col">
        <b>Change password</b>
        <input id="cur" type="password" placeholder="Current password" autocomplete="current-password">
        <input id="npw" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
        <div id="perr" class="err"></div><div id="pok" class="ok"></div>
        <button id="chg" class="btn ghost">Change password</button>
      </div>
      <button id="out" class="btn ghost">Sign out</button>`;
    $("chg").onclick = doChangePw;
    $("chgem").onclick = doChangeEmail;
    if (isPro && $("portal")) $("portal").onclick = doPortal;
    $("out").onclick = signOut;
  }
  async function doChangeEmail() {
    $("eerr").textContent = ""; $("eok").textContent = "";
    try {
      const r = await api("POST", "/v1/auth/change-email", { newEmail: $("nem").value.trim(), currentPassword: $("ecur").value }, true);
      email = r.email || $("nem").value.trim(); sessionStorage.setItem("oh_email", email);
      $("eok").textContent = "Email changed. Sign in with it on your other devices.";
      $("nem").value = ""; $("ecur").value = ""; render();
    } catch (e) { $("eerr").textContent = e.message; }
  }
  async function doPortal() {
    $("porterr").textContent = "Opening…";
    try {
      const r = await api("POST", "/v1/stripe/portal", { returnUrl: location.href }, true);
      if (r && r.url) { location.href = r.url; return; }
      $("porterr").textContent = "Couldn't open the billing portal.";
    } catch (e) {
      $("porterr").textContent = (e.message || "").includes("card subscription")
        ? "This Pro was bought on the App Store — manage it on your iPhone (Settings → your name → Subscriptions)."
        : e.message;
    }
  }
  async function doChangePw() {
    $("perr").textContent = ""; $("pok").textContent = "";
    try {
      await api("POST", "/v1/auth/change-password", { currentPassword: $("cur").value, newPassword: $("npw").value }, true);
      $("pok").textContent = "Password changed. Your other devices were signed out.";
      $("cur").value = ""; $("npw").value = "";
    } catch (e) { $("perr").textContent = e.message; }
  }
  function signOut() {
    fetch(API + "/v1/auth/logout", { method: "POST", headers: { "Authorization": "Bearer " + token } }).catch(() => {});
    token = acct = email = ""; sessionStorage.clear(); render();
  }

  render();
</script>
</body>
</html>
