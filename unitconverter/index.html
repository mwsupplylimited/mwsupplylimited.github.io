        <h1>Metron</h1>
        <p class="subtitle">Unit Converter for iPhone &amp; iPad. <span class="pill">Version 1.0</span></p>

        <h2>About</h2>
        <p>Metron is a unit converter built for people who are paid to be right about numbers &mdash; STEM students, engineers and working scientists. It covers well over a hundred categories and more than twelve hundred units, and every one of them is free, forever.</p>
        <p>What makes it different from a table of factors is the rigour around the number: significant figures, compound and derived units such as <strong>J/(mol&middot;K)</strong>, dimensional checking that refuses an impossible conversion instead of quietly returning a wrong answer, uncertainty carried correctly through a calculation, and the CODATA&nbsp;2022 physical constants with their published uncertainties.</p>
        <p>Every conversion runs on your device. Metron makes no network request of its own.</p>

        <h2>Getting started</h2>
        <ul>
            <li><strong>Convert</strong> &mdash; pick a category, type a value once, and every compatible unit updates live. Tap any row to copy it; press and hold for its definition, its exactness and its source.</li>
            <li><strong>Favourites</strong> &mdash; star the units you use and they sort to the top of the list.</li>
            <li><strong>Solve</strong> &mdash; type an expression the way you would write it: <code>9.81 m/s^2 to ft/min^2</code>, <code>2.5e-3 mol/L &times; 180 g/mol</code>, <code>h*c/(500 nm) to eV</code>.</li>
            <li><strong>Constants</strong> &mdash; browse the CODATA&nbsp;2022 set, free. Tap to copy a value, its uncertainty or its symbol.</li>
            <li><strong>History</strong> &mdash; everything you have converted, searchable, and one tap to run it again.</li>
        </ul>

        <h2>Where the numbers come from</h2>
        <p>Every factor in Metron is sourced, and the app will tell you which source, on any unit&rsquo;s detail sheet:</p>
        <ul>
            <li><strong>SI Brochure, 9th edition</strong> (BIPM, 2019) &mdash; the SI base and derived units, and the 2019 redefinition.</li>
            <li><strong>NIST Special Publication 811</strong>, Appendix&nbsp;B &mdash; US customary and other conversions.</li>
            <li><strong>CODATA 2022</strong> &mdash; the recommended values of the fundamental physical constants, with their standard uncertainties.</li>
            <li><strong>ISO/IEC 80000</strong>, the <strong>1959 International Yard and Pound Agreement</strong>, <strong>IAU</strong> resolutions and <strong>IUPAC</strong> atomic weights, where each applies.</li>
        </ul>
        <p>Metron distinguishes a value that is <em>exact by definition</em> from one that is <em>measured</em>. <code>1 in &equiv; 2.54 cm</code> is true by fiat and will never change; the unified atomic mass unit is a measurement that has moved four times since 1986. The app marks which is which.</p>

        <h2>Metron Pro</h2>
        <p>Every category, every unit and full-precision conversion are free forever, with or without Pro. We think paywalling a base SI unit is indefensible.</p>
        <p>Pro adds the workflow around the numbers: the expression solver, significant figures and uncertainty propagation, molar mass from a chemical formula, unlimited history and favourites, custom units, export to CSV, LaTeX and Markdown, widgets and Shortcuts, iCloud sync, and no ads.</p>
        <p>Pro is available monthly or annually, with a 7-day free trial on the annual plan, or as a one-time Lifetime purchase. You can see, change or cancel your plan at any time under <strong>Settings &rsaquo; Membership</strong>, which also has a Restore Purchases button.</p>

        <h2>FAQ</h2>

        <h3>Why does Metron refuse to convert joules to newtons?</h3>
        <p>Because energy and force are different physical dimensions, and no factor relates them. Most converters would either hide the option or return a number anyway. Metron tells you why it cannot: <em>&ldquo;Cannot convert L&sup2;&nbsp;M&nbsp;T&#8315;&sup2; to L&nbsp;M&nbsp;T&#8315;&sup2; &mdash; the dimensions differ.&rdquo;</em> Catching that mistake is the point.</p>

        <h3>Which gallon, ounce, ton or calorie does it use?</h3>
        <p>Whichever you pick. Metron never ships a bare &ldquo;gallon&rdquo;: it has US liquid, US dry and imperial gallons as separate units, avoirdupois and troy ounces, short, long and metric tons, thermochemical and IT calories, and so on. Confusing them is the most common real-world conversion error, so the app makes the choice explicit.</p>

        <h3>Why is a temperature interval a separate category?</h3>
        <p>Because a rise of 1&nbsp;&deg;C is a rise of 1&nbsp;K, not 274.15&nbsp;K. Absolute temperatures and temperature differences convert by different rules, and an app with only one temperature category gets one of them wrong. Metron ships both.</p>

        <h3>Do I ever see a wrong number because I am on the free tier?</h3>
        <p>No. The engine always works at full precision. The free tier limits how many significant digits are <em>displayed</em>, never what is computed.</p>

        <h3>Does Metron work offline?</h3>
        <p>Completely. Metron makes no network request of its own. The only network traffic in the free version belongs to the advertising SDK; Pro removes that too.</p>

        <h3>Something is wrong with a conversion factor.</h3>
        <p>Please tell us, and say which unit and which source you are checking against. A wrong factor is the most serious bug this app can have and it will be fixed in the next build.</p>
